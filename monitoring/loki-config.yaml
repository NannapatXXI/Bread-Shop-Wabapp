# Loki แบบเครื่องเดียว เก็บ log ลงดิสก์ (volume loki-data)
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# เก็บ log 30 วัน แล้วลบทิ้งอัตโนมัติ — ไม่งั้นดิสก์เต็มเรื่อย ๆ
limits_config:
  retention_period: 720h
  # รับ log ย้อนหลังได้เท่าระยะเก็บ — Alloy ปิดไปหลายวันแล้วเปิดใหม่ log ช่วงนั้นไม่หาย (ค่าเริ่มต้นแค่ 7 วัน)
  reject_old_samples_max_age: 720h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
