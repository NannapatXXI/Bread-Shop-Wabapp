# Grafana ต่อ Loki + Prometheus ให้อัตโนมัติตอนเปิด — ไม่ต้องตั้งในหน้าเว็บเอง
# uid คงที่ เพื่อให้ dashboard ใน monitoring/dashboards อ้างถึงได้
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
