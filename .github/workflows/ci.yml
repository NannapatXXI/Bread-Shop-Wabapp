name: CI

# รันทุกครั้งที่ push หรือเปิด Pull Request มายัง branch main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────
  #  JOB 1: Build Spring Boot (Backend)
  # ─────────────────────────────────────────
  backend:
    name: Build Backend (Java 21)
    runs-on: ubuntu-latest

    # spin up MySQL 8 ให้พร้อมก่อนรัน steps
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_pass
          MYSQL_DATABASE: breadProject
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, Test & Static analysis (PMD + SpotBugs)
        working-directory: backend
        # -Dintegration=true เปิด XxiApplicationTests (contextLoads)
        # verify = package + pmd:check + spotbugs:check — เจอปัญหาใหม่ CI ไม่ผ่าน
        run: ./mvnw clean verify -Dintegration=true
        env:
          DB_PASSWORD: ci_test_pass
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          # override Flyway สำหรับ DB ใหม่เปล่า — ให้รัน V1 ตั้งแต่ต้น
          SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────
  #  JOB 2: Build Next.js (Frontend)
  # ─────────────────────────────────────────
  frontend:
    name: Lint, Test & Build Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # error ตัวเดียวก็ fail (เช่น console.log ค้าง, เรียกฟังก์ชันที่ไม่มีอยู่จริง)
      # --max-warnings=0 → warning ใหม่ก็ไม่ให้ผ่าน รักษาสถานะ lint สะอาดไว้
      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      # Vitest + React Testing Library — รันเทสหน้าเว็บ/ตะกร้า/interceptor ทั้งหมด
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build Next.js
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
